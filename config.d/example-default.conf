# notmuch-task configuration file (bash-sourceable KEY=VALUE).
#
# Place this file (or a copy) under <hooks.location>/notmuch-task/config.d/.
# The hooks default to reading configs from the bundle's own config.d/
# directory - the same place bash install.bash copies the example
# configs to on first install. Set $NOTMUCH_TASK_CONFIG_DIR to point at a
# different directory if you want configs elsewhere.
#
# Each `*.conf` (or `*.bash`) file in config.d/ is loaded as a whole
# config; defaults are reapplied per file, so unset keys in this file do
# not leak values from a previous iteration. Files iterate in alphabetical
# order - prefix with a number (10-, 20-) for deterministic ordering.
#
# Multiple files = multiple notmuch queries / tag pools mirrored side by
# side. See config.d/example-multi.conf for a second-pool template.
#
# Every configurable key is listed below. Active keys show the example
# values; commented-out keys use the built-in default (see
# notmuch_task::set_config_defaults in hooks/notmuch-task/lib/notmuch-task-lib.bash).

# The notmuch search query whose matching messages are import candidates.
# Messages carrying the trigger tag (default `todo`) are import-eligible.
query=tag:todo

# Project assigned to mirrored tasks (optional; empty = no project).
project=notmuch

# UDA names (must match the uda.* lines in hooks/notmuch-task/notmuch-task.taskrc).
# notmuchid_uda=notmuchid         # bare message-id (RFC 5322, no angle brackets)
# notmuchstate_uda=notmuchstate   # mirror of the latest applied state tag
# notmuchmsgid_uda=notmuchmsgid   # full RFC 5322 id <id@host>, informational

# State-tag convention: TW state -> notmuch tag. The trigger tag is what
# makes a message import-eligible; the state tags mark the task's mirror
# state inside notmuch.
# trigger_tag=todo          # import candidates carry this tag
# pending_tag=task-pending  # added when task -> pending (and on first import)
# done_tag=task-done        # added when task -> completed
# deleted_tag=task-deleted  # added when task -> deleted

# Tags stripped when entering the respective state. Default strips the
# trigger tag on first import so the message leaves the "import me" pool.
# remove_on_pending=todo
# remove_on_done=todo
# remove_on_deleted=todo

# Push Taskwarrior changes back to notmuch (on-modify hook).
# sync_on_modify=1
# sync_tags_on_modify=0         # off by default to be safe
# sync_description_on_launch=1  # 0 keeps locally-edited descriptions after a launch sync

# notmuch_bin=notmuch           # override if not on PATH
# quiet=0                       # 1 silences non-error feedback

# Initialize a mirrored task's `entry` (and therefore its age) from the
# message's Date header rather than the import moment. Costs one extra
# `notmuch show` call per new message per on-launch pass. When 0 the
# per-message enrichment is skipped entirely (no Subject/Date harvest).
init_age_from_notmuch=1