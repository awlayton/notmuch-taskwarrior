# config.d/example-multi.conf -- second-pool template.
#
# Drop this file (or a copy) alongside example-default.conf under
# <hooks.location>/notmuch-task/config.d/ (the bundle's own config.d/,
# the default the hooks read from on first install) to mirror a SECOND
# notmuch query / tag pool in the same Taskwarrior task list. Each file
# is its own whole config (defaults from notmuch_task::set_config_defaults
# apply per-file), so an unset key here does NOT inherit from
# example-default.conf or any other sibling.
#
# Filename alphabetical order is the iteration order. Concatenate multiple
# pools by naming them 10-default.conf, 20-multi.conf, etc., so the order
# is explicit.

# A different tag pool: messages tagged `waiting-for` are imported here.
query=tag:waiting-for

# Project for tasks mirrored from THIS config's snapshot. Tasks from
# example-default.conf keep their own project - see README.
project=waiting

# UDA names (must match the uda.* lines in hooks/notmuch-task/notmuch-task.taskrc).
# notmuchid_uda=notmuchid         # bare message-id (RFC 5322, no angle brackets)
# notmuchstate_uda=notmuchstate   # mirror of the latest applied state tag
# notmuchmsgid_uda=notmuchmsgid   # full RFC 5322 id <id@host>, informational

# State-tag convention: TW state -> notmuch tag.
# trigger_tag=todo          # import candidates carry this tag
# pending_tag=task-pending  # added when task -> pending (and on first import)
# done_tag=task-done        # added when task -> completed
# deleted_tag=task-deleted  # added when task -> deleted

# Tags stripped when entering the respective state.
# remove_on_pending=todo
# remove_on_done=todo
# remove_on_deleted=todo

# Push Taskwarrior changes back to notmuch (on-modify hook). Last sourced
# config's values win for any push-time keys (sync_on_modify, state tags,
# UDA names, etc.).
# sync_on_modify=1
# sync_tags_on_modify=0         # off by default to be safe
# sync_description_on_launch=1  # 0 keeps locally-edited descriptions after a launch sync

# notmuch_bin=notmuch           # override if not on PATH
# quiet=0                       # 1 silences non-error feedback

# Initialize a mirrored task's `entry` (and therefore its age) from the
# message's Date header rather than the import moment.
# init_age_from_notmuch=1